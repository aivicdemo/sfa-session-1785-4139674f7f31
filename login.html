<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匠SFA - ログイン画面</title>
  <style>
    :root {
      /* Primary Color - kintone Blue */
      --primary: #4a90e2;
      --primary-hover: #357abd;
      
      /* Background Colors - Light Theme with Blue Tint */
      --bg-main: #f0f4f9;
      --bg-card: #ffffff;
      --bg-sidebar: #e8ecf3;
      
      /* Border & Divider */
      --border: #d0dae8;
      
      /* Text Colors */
      --text: #1a1a1a;
      --text-muted: #666666;
      
      /* Top Bar */
      --top-bar-bg: #ffffff;
      --top-bar-border: #d0dae8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, var(--bg-main) 0%, #e3eef7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(74, 144, 226, 0.08), 0 4px 24px rgba(0, 0, 0, 0.06);
      padding: 48px 40px;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .system-name {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-of-type {
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #999999;
    }

    .login-button {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .login-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(74, 144, 226, 0.2);
    }

    .login-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer strong {
      color: var(--primary);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 40px 24px;
      }

      .login-title {
        font-size: 18px;
      }

      .login-button {
        padding: 11px 14px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">匠SFA</div>
        <div class="system-name">営業プロセス監査・分析管理システム</div>
      </div>

      <h1 class="login-title" data-testid="login-title">ログイン</h1>
      <p class="login-subtitle">営業プロセスの監査・分析を始めましょう</p>

      <form data-testid="login-form" novalidate>
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button
          type="submit"
          class="login-button"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <strong>サンプル実装</strong><br>
        どの入力でもログインできます
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
