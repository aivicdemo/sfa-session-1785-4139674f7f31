window.AIVIC_APP_ID = "session-1785473525729";

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const PAGE_SIZE = 20;\n  let allLogs = [];\n  let filteredLogs = [];\n  let currentPage = 1;\n\n  const timeline = container.querySelector('#log-timeline');\n  const logCountEl = container.querySelector('#log-count');\n  const logPageEl = container.querySelector('#log-page');\n  const template = container.querySelector('#log-entry-template');\n\n  const userFilterEl = container.querySelector('[data-testid=\"user-filter\"]');\n  const dateFromEl = container.querySelector('[data-testid=\"date-from\"]');\n  const dateToEl = container.querySelector('[data-testid=\"date-to\"]');\n  const opTypeFilterEl = container.querySelector('[data-testid=\"operation-type-filter\"]');\n  const customerSearchEl = container.querySelector('[data-testid=\"customer-search\"]');\n  const searchBtn = container.querySelector('[data-testid=\"search-button\"]');\n  const exportBtn = container.querySelector('[data-testid=\"export-csv-button\"]');\n  const prevPageBtn = container.querySelector('[data-testid=\"prev-page-button\"]');\n  const nextPageBtn = container.querySelector('[data-testid=\"next-page-button\"]');\n\n  // Load logs from API\n  async function loadLogs() {\n    try {\n      allLogs = await window.aivicApi.list(0) || [];\n      // Sort by datetime descending (newest first)\n      allLogs.sort((a, b) => new Date(b.datetime || 0) - new Date(a.datetime || 0));\n      filteredLogs = [...allLogs];\n      currentPage = 1;\n      renderLogs();\n    } catch (err) {\n      console.error('Failed to load logs:', err);\n      timeline.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); padding: 24px;\">ログの読み込みに失敗しました</div>';\n    }\n  }\n\n  // Apply filters\n  function applyFilters() {\n    const userFilter = userFilterEl.value.toLowerCase();\n    const dateFrom = dateFromEl.value ? new Date(dateFromEl.value) : null;\n    const dateTo = dateToEl.value ? new Date(dateToEl.value) : null;\n    const opTypeFilter = opTypeFilterEl.value;\n    const customerSearch = customerSearchEl.value.toLowerCase();\n\n    filteredLogs = allLogs.filter(log => {\n      // User filter\n      if (userFilter && !(log.user || '').toLowerCase().includes(userFilter)) return false;\n      \n      // Date range filter\n      if (dateFrom || dateTo) {\n        const logDate = new Date(log.datetime || 0);\n        if (dateFrom && logDate < dateFrom) return false;\n        if (dateTo && logDate > dateTo) return false;\n      }\n\n      // Operation type filter\n      if (opTypeFilter && log.operationType !== opTypeFilter) return false;\n\n      // Customer search\n      if (customerSearch) {\n        const custId = (log.customerId || '').toLowerCase();\n        const custName = (log.customerName || '').toLowerCase();\n        if (!custId.includes(customerSearch) && !custName.includes(customerSearch)) return false;\n      }\n\n      return true;\n    });\n\n    currentPage = 1;\n    renderLogs();\n  }\n\n  // Render logs\n  function renderLogs() {\n    timeline.innerHTML = '';\n\n    if (filteredLogs.length === 0) {\n      timeline.innerHTML = '<div style=\"text-align: center; color: var(--text-muted); padding: 24px; font-size: 13px;\">該当するログがありません</div>';\n      logCountEl.textContent = '0';\n      logPageEl.textContent = '1';\n      return;\n    }\n\n    const start = (currentPage - 1) * PAGE_SIZE;\n    const end = start + PAGE_SIZE;\n    const pageLogs = filteredLogs.slice(start, end);\n\n    pageLogs.forEach(log => {\n      const card = template.content.cloneNode(true);\n      const entry = card.querySelector('.log-entry-card');\n\n      // Populate card\n      card.querySelector('.log-user').textContent = log.user || '-';\n      card.querySelector('.log-datetime').textContent = formatDateTime(log.datetime);\n      card.querySelector('.log-type').textContent = log.operationType || '-';\n      card.querySelector('.log-customer').textContent = `${log.customerId || '-'} / ${log.customerName || '-'}`;\n      card.querySelector('.log-id').textContent = log.id || '-';\n      card.querySelector('.log-detail').textContent = log.detail || '-';\n\n      // Show/hide details based on operation type\n      const detailsDiv = card.querySelector('.log-details');\n      const changesDiv = card.querySelector('.log-changes');\n      const reasonDiv = card.querySelector('.log-reason');\n\n      if (log.operationType === '修正' && log.changes) {\n        changesDiv.style.display = 'block';\n        const tbody = card.querySelector('.changes-tbody');\n        tbody.innerHTML = '';\n        log.changes.forEach(change => {\n          const row = document.createElement('tr');\n          row.style.borderBottom = '1px solid var(--border)';\n          row.innerHTML = `\n            <td style=\"padding: 6px; color: var(--text);\">${change.field || '-'}</td>\n            <td style=\"padding: 6px; color: var(--text-muted); text-decoration: line-through;\">${change.before || '-'}</td>\n            <td style=\"padding: 6px; color: var(--primary); font-weight: 500;\">${change.after || '-'}</td>\n          `;\n          tbody.appendChild(row);\n        });\n      }\n\n      if (log.operationType === '統合判定' && log.reason) {\n        reasonDiv.style.display = 'block';\n        card.querySelector('.reason-text').textContent = log.reason;\n      }\n\n      // Toggle expand/collapse\n      entry.addEventListener('click', () => {\n        const isExpanded = detailsDiv.style.display !== 'none';\n        detailsDiv.style.display = isExpanded ? 'none' : 'block';\n        const icon = card.querySelector('.expand-icon');\n        icon.textContent = isExpanded ? '▼' : '▲';\n        entry.style.background = isExpanded ? 'var(--bg-card)' : 'var(--bg-main)';\n      });\n\n      timeline.appendChild(card);\n    });\n\n    // Update pagination\n    const totalPages = Math.ceil(filteredLogs.length / PAGE_SIZE);\n    logCountEl.textContent = filteredLogs.length;\n    logPageEl.textContent = currentPage;\n    prevPageBtn.disabled = currentPage === 1;\n    nextPageBtn.disabled = currentPage >= totalPages;\n    prevPageBtn.style.opacity = currentPage === 1 ? '0.5' : '1';\n    nextPageBtn.style.opacity = currentPage >= totalPages ? '0.5' : '1';\n  }\n\n  // Format datetime\n  function formatDateTime(dt) {\n    if (!dt) return '-';\n    const d = new Date(dt);\n    return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });\n  }\n\n  // Export CSV\n  function exportCSV() {\n    if (filteredLogs.length === 0) {\n      alert('エクスポートするログがありません');\n      return;\n    }\n\n    const headers = ['操作者', '操作日時', '操作種別', '顧客ID', '顧客名', '操作ID', '詳細'];\n    const rows = filteredLogs.map(log => [\n      log.user || '',\n      formatDateTime(log.datetime),\n      log.operationType || '',\n      log.customerId || '',\n      log.customerName || '',\n      log.id || '',\n      log.detail || ''\n    ]);\n\n    const csv = '\\uFEFF' + [headers, ...rows].map(row => \n      row.map(cell => `\"${String(cell).replace(/\"/g, '\"\"')}\"`).join(',')\n    ).join('\\n');\n\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `audit-log-${new Date().toISOString().slice(0, 10)}.csv`;\n    link.click();\n  }\n\n  // Event listeners\n  searchBtn.addEventListener('click', applyFilters);\n  exportBtn.addEventListener('click', exportCSV);\n  prevPageBtn.addEventListener('click', () => {\n    if (currentPage > 1) {\n      currentPage--;\n      renderLogs();\n      timeline.scrollTop = 0;\n    }\n  });\n  nextPageBtn.addEventListener('click', () => {\n    const totalPages = Math.ceil(filteredLogs.length / PAGE_SIZE);\n    if (currentPage < totalPages) {\n      currentPage++;\n      renderLogs();\n      timeline.scrollTop = 0;\n    }\n  });\n\n  // Initial load\n  loadLogs();\n}";
</script>

      <div class="log-changes" style="margin-bottom: 12px; display: none;">

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
