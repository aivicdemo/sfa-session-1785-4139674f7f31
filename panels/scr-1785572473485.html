<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顧客購買支援ポータル</title>
  <style>
:root {
  --primary: #0066cc;
  --primary-hover: #0052a3;
  --bg-main: #f0f4f9;
  --bg-card: #ffffff;
  --bg-sidebar: #e8ecf1;
  --border: #d0d8e0;
  --text: #1a1a1a;
  --text-muted: #666666;
  --top-bar-bg: #ffffff;
  --top-bar-border: #d0d8e0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg-main);
  color: var(--text);
  line-height: 1.4;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  background: var(--top-bar-bg);
  border-bottom: 1px solid var(--top-bar-border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-logo {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.5px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
}

.user-name {
  font-size: 13px;
  color: var(--text);
}

.user-logout {
  font-size: 12px;
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.user-logout:hover {
  color: var(--primary-hover);
}

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 240px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 16px 0;
}

.sidebar-section {
  padding: 0 12px 16px 12px;
}

.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  padding: 8px 12px;
  margin-bottom: 4px;
}

.nav-item {
  display: block;
  padding: 10px 12px;
  margin: 2px 0;
  font-size: 13px;
  color: var(--text);
  text-decoration: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  border-left: 2px solid transparent;
}

.nav-item:hover {
  background: rgba(0, 102, 204, 0.08);
}

.nav-item.aivic-active {
  background: rgba(0, 102, 204, 0.12);
  color: var(--primary);
  border-left-color: var(--primary);
  font-weight: 500;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
}

[data-aivic-panel] {
  min-height: 100%;
  padding: 24px;
}

.workspace-header {
  margin-bottom: 24px;
}

.workspace-title {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.workspace-subtitle {
  font-size: 13px;
  color: var(--text-muted);
}

.workspace-toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--bg-main);
}

.filter-group {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-input {
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-card);
  color: var(--text);
  min-width: 160px;
}

.filter-input::placeholder {
  color: var(--text-muted);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 16px;
}

.kpi-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.kpi-value {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
}

.kpi-delta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead {
  background: var(--bg-main);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tbody tr:hover {
  background: rgba(0, 102, 204, 0.02);
}

tbody tr:last-child td {
  border-bottom: none;
}

.status-badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
}

.status-pending {
  background: rgba(255, 193, 7, 0.15);
  color: #f57f17;
}

.status-approved {
  background: rgba(76, 175, 80, 0.15);
  color: #388e3c;
}

.status-rejected {
  background: rgba(244, 67, 54, 0.15);
  color: #c62828;
}

.status-draft {
  background: rgba(158, 158, 158, 0.15);
  color: #424242;
}

.match-score {
  font-weight: 600;
  font-size: 14px;
}

.match-high {
  color: #388e3c;
}

.match-medium {
  color: #f57f17;
}

.match-low {
  color: #c62828;
}

.action-cell {
  display: flex;
  gap: 8px;
}

.action-link {
  color: var(--primary);
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
  transition: color 0.2s;
}

.action-link:hover {
  color: var(--primary-hover);
  text-decoration: underline;
}

.split-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.panel-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
}

.panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 8px 12px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-card);
  color: var(--text);
  font-family: inherit;
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
}

.form-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.evaluation-grid {
  display: grid;
  gap: 12px;
}

.evaluation-row {
  display: grid;
  grid-template-columns: 1fr 80px 120px;
  gap: 12px;
  align-items: center;
  padding: 12px;
  background: var(--bg-main);
  border-radius: 4px;
  font-size: 13px;
}

.evaluation-label {
  font-weight: 500;
  color: var(--text);
}

.evaluation-value {
  text-align: right;
  color: var(--text-muted);
  font-size: 12px;
}

.evaluation-result {
  text-align: center;
  font-weight: 600;
}

.match-indicator {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

.match-ok {
  background: #4caf50;
}

.match-ng {
  background: #f44336;
}

.match-warning {
  background: #ffc107;
}

.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.tab {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.stepper {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  align-items: center;
}

.step {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-number {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-main);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.step.active .step-number {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.step.completed .step-number {
  background: #4caf50;
  border-color: #4caf50;
  color: #fff;
}

.step-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
}

.step.active .step-label {
  color: var(--text);
}

.step-divider {
  flex: 1;
  height: 2px;
  background: var(--border);
  margin: 0 -8px;
}

.step.completed .step-divider {
  background: #4caf50;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  color: var(--text-muted);
  cursor: pointer;
}

.modal-body {
  padding: 20px;
}

.modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-text {
  font-size: 14px;
  margin-bottom: 4px;
}

.empty-hint {
  font-size: 12px;
  color: var(--text-muted);
}

@media (max-width: 1024px) {
  .split-layout {
    grid-template-columns: 1fr;
  }
  
  .sidebar {
    width: 200px;
  }
}

@media (max-width: 768px) {
  .main-container {
    flex-direction: column;
  }
  
  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    padding: 0;
  }
  
  .sidebar-section {
    padding: 12px 16px;
    white-space: nowrap;
  }
  
  .nav-item {
    display: inline-block;
    margin: 0 4px;
  }
  
  header {
    padding: 0 16px;
  }
  
  [data-aivic-panel] {
    padding: 16px;
  }
  
  .kpi-grid {
    grid-template-columns: 1fr;
  }
}

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const proposalTable = tables[0];\n  const customerTable = tables[1];\n  const constraintTable = tables[2];\n  const evaluationTable = tables[3];\n  const ruleTable = tables[4];\n\n  let currentProposal = null;\n  let evaluationHistory = [];\n\n  // ===== 初期化 =====\n  async function init() {\n    await loadCustomers();\n    await loadEvaluationHistory();\n    updateKPIs();\n  }\n\n  // ===== 顧客一覧をロード =====\n  async function loadCustomers() {\n    const customers = await window.aivicApi.list(1); // customerTable\n    if (!customers) return;\n\n    const select = container.querySelector('[data-testid=\"customer-select\"]');\n    customers.forEach(cust => {\n      const opt = document.createElement('option');\n      opt.value = cust.id;\n      opt.textContent = cust.顧客名 || cust.name;\n      select.appendChild(opt);\n    });\n  }\n\n  // ===== 照合・評価実行 =====\n  container.querySelector('[data-testid=\"evaluate-button\"]').addEventListener('click', async () => {\n    const customerId = container.querySelector('[data-testid=\"customer-select\"]').value;\n    const title = container.querySelector('[data-testid=\"proposal-title\"]').value;\n    const amount = parseInt(container.querySelector('[data-testid=\"proposal-amount\"]').value) || 0;\n    const content = container.querySelector('[data-testid=\"proposal-content\"]').value;\n\n    if (!customerId || !title || !amount || !content) {\n      alert('すべての項目を入力してください');\n      return;\n    }\n\n    // 提案を保存\n    const saved = await window.aivicApi.save(0, {\n      顧客ID: customerId,\n      提案タイトル: title,\n      提案内容: content,\n      提案金額: amount,\n      ステータス: '下書き'\n    });\n\n    if (!saved) return;\n    currentProposal = saved;\n\n    // 照合ルール取得\n    const rules = await window.aivicApi.list(4);\n    const selectedRules = Array.from(container.querySelectorAll('input[name=\"rule\"]:checked')).map(el => el.value);\n\n    // 顧客制約条件取得\n    const constraints = await window.aivicApi.list(2);\n    const customerConstraints = constraints.filter(c => c.顧客ID === customerId);\n\n    // 簡易的な照合ロジック\n    const violations = [];\n    let score = 100;\n\n    // 予算チェック\n    if (selectedRules.includes('budget')) {\n      const budgetConstraint = customerConstraints.find(c => c.制約条件タイプ === '購買金額上限');\n      if (budgetConstraint) {\n        const limit = parseInt(budgetConstraint.制約値) || 0;\n        if (amount > limit) {\n          violations.push(`予算超過: 提案金額 ¥${amount.toLocaleString()} > 上限 ¥${limit.toLocaleString()}`);\n          score -= 30;\n        }\n      }\n    }\n\n    // 頻度チェック\n    if (selectedRules.includes('frequency')) {\n      const frequencyConstraint = customerConstraints.find(c => c.制約条件タイプ === '購買頻度制限');\n      if (frequencyConstraint) {\n        violations.push(`購買頻度制限: ${frequencyConstraint.制約値}`);\n        score -= 10;\n      }\n    }\n\n    score = Math.max(0, score);\n    const status = score >= 80 ? '合格' : score >= 60 ? '要確認' : '不合格';\n\n    // 評価結果を保存\n    const evaluation = await window.aivicApi.save(3, {\n      提案ID: currentProposal.id,\n      顧客ID: customerId,\n      評価ステータス: status,\n      適合性スコア: score,\n      照合結果詳細: `提案内容を顧客制約条件と照合しました。${violations.length === 0 ? 'すべての条件を満たしています。' : '以下の項目で制約条件に違反しています。'}`,\n      不適合項目: violations.join('\\n'),\n      評価実施日時: new Date().toISOString()\n    });\n\n    if (!evaluation) return;\n\n    // 結果表示\n    displayEvaluation(evaluation, violations);\n    evaluationHistory.unshift(evaluation);\n    updateKPIs();\n    updateEvaluationHistory();\n  });\n\n  // ===== 評価結果表示 =====\n  function displayEvaluation(evaluation, violations) {\n    const resultDiv = container.querySelector('#evaluation-result');\n    const emptyDiv = container.querySelector('#evaluation-empty');\n\n    container.querySelector('#eval-status').textContent = evaluation.評価ステータス;\n    container.querySelector('#eval-score').textContent = `${evaluation.適合性スコア}%`;\n    container.querySelector('#eval-detail').textContent = evaluation.照合結果詳細;\n    container.querySelector('#eval-violations').textContent = violations.length > 0 ? violations.join('\\n') : 'なし';\n\n    resultDiv.style.display = 'block';\n    emptyDiv.style.display = 'none';\n\n    // 最終分析結果を更新\n    const analysisDiv = container.querySelector('#analysis-result');\n    analysisDiv.innerHTML = `\n      <div><strong>提案ID:</strong> ${currentProposal.id}</div>\n      <div><strong>評価ステータス:</strong> <span style=\"color: ${evaluation.評価ステータス === '合格' ? '#2e7d32' : evaluation.評価ステータス === '要確認' ? '#f57c00' : '#d32f2f'};\">${evaluation.評価ステータス}</span></div>\n      <div><strong>適合性スコア:</strong> ${evaluation.適合性スコア}%</div>\n      <div style=\"margin-top: 8px; font-size: 11px; color: var(--text-muted);\">評価実施: ${new Date(evaluation.評価実施日時).toLocaleString('ja-JP')}</div>\n    `;\n  }\n\n  // ===== 修正内容保存 =====\n  container.querySelector('[data-testid=\"save-revision-button\"]').addEventListener('click', async () => {\n    if (!currentProposal) {\n      alert('先に提案を評価してください');\n      return;\n    }\n\n    const revisedAmount = parseInt(container.querySelector('[data-testid=\"revised-amount\"]').value) || 0;\n    const revisionNotes = container.querySelector('[data-testid=\"revision-notes\"]').value;\n\n    if (!revisedAmount || !revisionNotes) {\n      alert('修正内容をすべて入力してください');\n      return;\n    }\n\n    // 修正提案を保存\n    const updated = await window.aivicApi.update(0, currentProposal.id, {\n      提案金額: revisedAmount,\n      ステータス: '修正済み'\n    });\n\n    if (updated) {\n      alert('修正内容を保存しました');\n      container.querySelector('[data-testid=\"revised-amount\"]').value = '';\n      container.querySelector('[data-testid=\"revision-notes\"]').value = '';\n    }\n  });\n\n  // ===== PDF レポート生成 =====\n  container.querySelector('[data-testid=\"generate-report-button\"]').addEventListener('click', () => {\n    if (!currentProposal) {\n      alert('先に提案を評価してください');\n      return;\n    }\n\n    const reportContent = `\n提案管理レポート\n================\n提案ID: ${currentProposal.id}\n提案タイトル: ${currentProposal.提案タイトル}\n提案金額: ¥${currentProposal.提案金額.toLocaleString()}\n提案内容: ${currentProposal.提案内容}\n\n評価結果:\n- ステータス: ${container.querySelector('#eval-status').textContent}\n- 適合性スコア: ${container.querySelector('#eval-score').textContent}\n- 詳細: ${container.querySelector('#eval-detail').textContent}\n\n生成日時: ${new Date().toLocaleString('ja-JP')}\n    `;\n\n    const blob = new Blob([reportContent], { type: 'text/plain' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `proposal-report-${currentProposal.id}.txt`;\n    a.click();\n    URL.revokeObjectURL(url);\n  });\n\n  // ===== CSV エクスポート =====\n  container.querySelector('[data-testid=\"export-csv-button\"]').addEventListener('click', async () => {\n    const proposals = await window.aivicApi.list(0);\n    if (!proposals || proposals.length === 0) {\n      alert('エクスポートするデータがありません');\n      return;\n    }\n\n    const headers = ['提案ID', '顧客ID', '提案タイトル', '提案金額', 'ステータス', '作成日時'];\n    const rows = proposals.map(p => [\n      p.id,\n      p.顧客ID,\n      p.提案タイトル,\n      p.提案金額,\n      p.ステータス,\n      new Date(p.作成日時).toLocaleString('ja-JP')\n    ]);\n\n    const csv = '\\uFEFF' + [headers, ...rows].map(row => row.map(cell => `\"${String(cell).replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `proposals-${new Date().toISOString().slice(0, 10)}.csv`;\n    a.click();\n    URL.revokeObjectURL(url);\n  });\n\n  // ===== 評価履歴表示 =====\n  async function loadEvaluationHistory() {\n    const evaluations = await window.aivicApi.list(3);\n    if (evaluations) {\n      evaluationHistory = evaluations.sort((a, b) => new Date(b.評価実施日時) - new Date(a.評価実施日時));\n      updateEvaluationHistory();\n    }\n  }\n\n  function updateEvaluationHistory() {\n    const historyDiv = container.querySelector('#evaluation-history');\n    if (evaluationHistory.length === 0) {\n      historyDiv.innerHTML = '<div style=\"text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;\">評価履歴はありません</div>';\n      return;\n    }\n\n    historyDiv.innerHTML = evaluationHistory.slice(0, 10).map((eval, idx) => `\n      <div style=\"display: flex; gap: 10px; padding: 10px; border-left: 2px solid var(--primary); margin-bottom: 8px; background: var(--bg-main); border-radius: 4px;\">\n        <div style=\"flex: 1;\">\n          <div style=\"font-size: 12px; font-weight: 600; color: var(--text);\">提案ID: ${eval.提案ID}</div>\n          <div style=\"font-size: 11px; color: var(--text-muted); margin-top: 2px;\">${new Date(eval.評価実施日時).toLocaleString('ja-JP')}</div>\n          <div style=\"font-size: 12px; color: var(--text); margin-top: 4px;\">\n            <span style=\"display: inline-block; padding: 2px 6px; border-radius: 3px; background: ${eval.評価ステータス === '合格' ? 'rgba(46,125,50,0.1)' : eval.評価ステータス === '要確認' ? 'rgba(245,127,0,0.1)' : 'rgba(211,47,47,0.1)'}; color: ${eval.評価ステータス === '合格' ? '#2e7d32' : eval.評価ステータス === '要確認' ? '#f57c00' : '#d32f2f'}; font-size: 11px;\">\n              ${eval.評価ステータス}\n            </span>\n            <span style=\"margin-left: 8px; font-size: 11px;\">スコア: ${eval.適合性スコア}%</span>\n          </div>\n        </div>\n      </div>\n    `).join('');\n  }\n\n  // ===== KPI 更新 =====\n  async function updateKPIs() {\n    const proposals = await window.aivicApi.list(0);\n    const evaluations = await window.aivicApi.list(3);\n\n    if (!proposals || !evaluations) return;\n\n    // 当月の提案数\n    const now = new Date();\n    const currentMonth = proposals.filter(p => {\n      const pDate = new Date(p.作成日時);\n      return pDate.getFullYear() === now.getFullYear() && pDate.getMonth() === now.getMonth();\n    });\n\n    // 平均適合性スコア\n    const avgScore = evaluations.length > 0\n      ? Math.round(evaluations.reduce((sum, e) => sum + (e.適合性スコア || 0), 0) / evaluations.length)\n      : 0;\n\n    // 修正後合格率\n    const passCount = evaluations.filter(e => e.評価ステータス === '合格').length;\n    const passRate = evaluations.length > 0 ? Math.round((passCount / evaluations.length) * 100) : 0;\n\n    container.querySelector('[data-testid=\"kpi-proposal-count\"]').textContent = currentMonth.length;\n    container.querySelector('[data-testid=\"kpi-avg-score\"]').textContent = `${avgScore}%`;\n    container.querySelector('[data-testid=\"kpi-pass-rate\"]').textContent = `${passRate}%`;\n  }\n\n  init();\n}";

      <button data-testid="save-revision-button" class="action-btn" style="width: 100%; padding: 8px; font-size: 12px;">修正内容を保存</button>
    </div>
  </div>
</div>

<!-- 最終分析結果 + レポート生成 -->
<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px;">
  <div class="card" style="padding: 14px;">
    <div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px;">最終分析結果</div>
    <div id="analysis-result" style="font-size: 12px; color: var(--text); line-height: 1.6; background: var(--bg-main); padding: 10px; border-radius: 4px; min-height: 120px;">
      <div style="color: var(--text-muted);">分析結果はここに表示されます</div>
    </div>
  </div>

  <div class="card" style="padding: 14px;">
    <div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px;">レポート生成</div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button data-testid="generate-report-button" class="action-btn" style="width: 100%; padding: 8px; font-size: 12px;">PDF レポート生成</button>
      <button data-testid="export-csv-button" class="action-btn secondary" style="width: 100%; padding: 8px; font-size: 12px; background: transparent; border: 1px solid var(--border); color: var(--text);">CSV エクスポート</button>
    </div>
  </div>
</div>

<!-- 評価履歴タイムライン -->
<div class="card" style="padding: 14px;">
  <div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px;">評価履歴</div>
  <div id="evaluation-history" style="max-height: 300px; overflow-y: auto;">
    <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;">
      評価履歴はここに表示されます
    </div>
  </div>
</div></div>
      </main>
    </div>
  </div>

  
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper ( SPA 版と同じ )
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API ( SPA 版と同じ )
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return;
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。 無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。 抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // content 要素の hidden 強制除去 ( 2026-05-24 Playwright 大量 fail 対応 )
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/\bmodal\b|\bdialog\b|\boverlay\b|\bpopup\b|\bdropdown\b|\btooltip\b/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
